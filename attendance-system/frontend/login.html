<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ – ระบบเช็กชื่อนักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 12px;
    }
    .logo h1 { font-size: 22px; font-weight: 800; color: #1f2937; }
    .logo p  { font-size: 14px; color: #6b7280; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 15px; font-family: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; }
    .input-wrap .form-control { padding-left: 40px; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px; color: #9ca3af;
    }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity .2s, transform .1s;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: .92; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg {
      background: #fee2e2; color: #dc2626;
      border: 1px solid #fca5a5; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; margin-bottom: 16px;
      display: none;
    }
    .demo-accounts {
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid #f3f4f6;
    }
    .demo-title { font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 10px; font-weight: 600; }
    .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .demo-btn {
      padding: 8px 10px; border: 1.5px solid #e5e7eb; border-radius: 8px;
      background: #f9fafb; cursor: pointer; font-family: inherit;
      font-size: 12px; text-align: left; transition: all .15s;
    }
    .demo-btn:hover { border-color: #4f46e5; background: #eef2ff; }
    .demo-btn .demo-role { font-weight: 700; color: #4f46e5; display: block; }
    .demo-btn .demo-cred { color: #6b7280; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: white;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <h1>ระบบเช็กชื่อนักเรียน</h1>
    <p>กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <form id="login-form" onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label">ชื่อผู้ใช้</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" class="form-control" placeholder="กรอก username" autocomplete="username" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">รหัสผ่าน</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-control" placeholder="กรอก password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" onclick="togglePw()" id="toggle-pw-btn">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="login-btn">🔑 เข้าสู่ระบบ</button>
  </form>

<script>
function fillDemo(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('username').focus();
}

function togglePw() {
  const inp = document.getElementById('password');
  const btn = document.getElementById('toggle-pw-btn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    window.location.href = '/index.html';
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '🔑 เข้าสู่ระบบ';
  }
}
</script>
</body>
</html>
